
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Lu Sapatilhas</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <div class="logo">
            <h1>lu</h1>
            <p>SAPATILHAS</p>
        </div>

        <h2>Bem-vindo(a)!</h2>
        <p class="subtitulo">Entre na sua conta para continuar.</p>

        <form>
            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="Digite seu e-mail" required>

            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Digite sua senha" required>

            <button type="submit">Entrar na minha conta</button>
        </form>

        <p class="cadastro">
            Ainda não possui conta?
            <a href="cadastro.html">Cadastre-se</a>
        </p>

        <div class="separador">
            <span>OU</span>
        </div>

        <a href="catalogo.html" class="botao-catalogo">
            Conhecer nossos produtos
        </a>

        <p class="visitante">
            Acesse nossa coleção sem precisar de cadastro.
        </p>

    </div>

</body>
</html>

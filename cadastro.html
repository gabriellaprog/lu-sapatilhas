<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro - Lu Sapatilhas</title>

    <style>
        /* Configuração geral */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Caixa principal */
        .container {
            background-color: white;
            width: 380px;
            padding: 30px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        /* Logotipo */
        .logo {
            width: 85px;
            height: 85px;
            background-color: black;
            border: 3px solid #c21836;
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: white;
            font-family: Georgia, serif;
            font-size: 35px;
            font-style: italic;
        }

        .logo span {
            font-family: Arial, sans-serif;
            font-size: 8px;
            letter-spacing: 2px;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 8px;
        }

        .mensagem {
            font-size: 13px;
            color: #555;
            margin-bottom: 20px;
        }

        /* Formulário */
        form {
            text-align: left;
        }

        label {
            display: block;
            font-size: 13px;
            margin-top: 12px;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 20px;
            background-color: #eeeeee;
            outline: none;
        }

        input:focus {
            border: 1px solid #c21836;
        }

        /* Botão */
        button {
            width: 75%;
            padding: 12px;
            margin-top: 25px;
            background-color: #dddddd;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        button:hover {
            background-color: #cccccc;
        }

        /* Link para login */
        .login {
            font-size: 12px;
            margin-top: 18px;
        }

        .login a {
            color: black;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Logotipo -->
        <div class="logo">
            lu
            <span>SAPATILHAS</span>
        </div>

        <h1>Crie sua conta!</h1>

        <p class="mensagem">
            Preencha seus dados para se cadastrar.
        </p>

        <form onsubmit="irParaCatalogo(event)">
            <!-- Nome -->
            <label for="nome">Nome completo:</label>
            <input type="text" id="nome" placeholder="Digite seu nome" required>

            <!-- E-mail -->
            <label for="email">E-mail:</label>
            <input type="email" id="email" placeholder="Digite seu e-mail" required>

            <!-- Telefone -->
            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone" placeholder="(00) 00000-0000" required>

            <!-- Endereço -->
            <label for="endereco">Endereço:</label>
            <input type="text" id="endereco" placeholder="Rua, número e bairro" required>

            <!-- Senha -->
            <label for="senha">Senha:</label>
            <input type="password" id="senha" placeholder="Crie uma senha" required>

            <!-- Confirmar senha -->
            <label for="confirmar">Confirmar senha:</label>
            <input type="password" id="confirmar" placeholder="Digite a senha novamente" required>

            <button type="submit">Cadastrar</button>

        </form>

        <p class="login">
            Já possui uma conta?
            <br>
            <a href="index.html">Faça login aqui</a>
        </p>

    </div>

    <script>

        function irParaCatalogo(event) {

            event.preventDefault();

            const senha = document.getElementById("senha").value;
            const confirmar = document.getElementById("confirmar").value;

            if (senha !== confirmar) {
                alert("As senhas não são iguais!");
                return;
            }

            window.location.href = "catalogo.html";

        }

    </script>

</body>

</html>
